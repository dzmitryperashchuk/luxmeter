<body>
    <div class="app-shell">
        <h1>Расчет освещения по зонам</h1>
        <div id="zones"></div>
    </div>

    <script>
        /**
         * Универсальный расчет освещения по методу коэффициента использования (EN 12464-1 / CIE).
         * Поддерживает любые углы рассеивания от 36° (узкие споты) до 120° (заливающие панели).
         */
        function calculateLighting(params) {
            const {
                length,
                width,
                ceilingHeight,
                fixtureDrop = 0,
                workPlane = 0.8,
                targetLux = 200,
                beamAngle = 120,
                reflectance = {
                    ceiling: 0.80,
                    walls: 0.70,
                    floor: 0.35
                },
                maintenanceFactor = 0.80,
                fixtureCount = 1,
                fixtureLumens = 1000
            } = params;

            const area = length * width;
            const hp = ceilingHeight - fixtureDrop - workPlane;
            if (hp <= 0) throw new Error("Расчетная высота должна быть больше нуля.");

            const roomIndex = area / (hp * (length + width));
            const kSteps = [0.60, 0.80, 1.00, 1.25, 1.50, 2.00, 2.50, 3.00];

            const cieAngleTables = {
                36: [
                    [0.72, 0.66], [0.80, 0.75], [0.85, 0.80], [0.89, 0.85],
                    [0.92, 0.88], [0.95, 0.92], [0.97, 0.94], [0.98, 0.95]
                ],
                60: [
                    [0.63, 0.56], [0.72, 0.66], [0.78, 0.72], [0.83, 0.78],
                    [0.86, 0.82], [0.90, 0.86], [0.93, 0.89], [0.95, 0.91]
                ],
                90: [
                    [0.54, 0.47], [0.64, 0.57], [0.71, 0.64], [0.77, 0.71],
                    [0.81, 0.76], [0.86, 0.81], [0.89, 0.85], [0.91, 0.88]
                ],
                100: [
                    [0.51, 0.44], [0.61, 0.54], [0.68, 0.61], [0.74, 0.68],
                    [0.78, 0.73], [0.84, 0.79], [0.88, 0.84], [0.90, 0.87]
                ],
                110: [
                    [0.49, 0.41], [0.59, 0.51], [0.66, 0.59], [0.72, 0.66],
                    [0.76, 0.71], [0.82, 0.77], [0.86, 0.82], [0.89, 0.85]
                ],
                120: [
                    [0.47, 0.39], [0.57, 0.49], [0.64, 0.57], [0.70, 0.64],
                    [0.75, 0.69], [0.81, 0.76], [0.85, 0.81], [0.88, 0.84]
                ]
            };

            function getUfByK(angleTable, kVal, schemeIdx) {
                if (kVal <= kSteps[0]) return angleTable[0][schemeIdx];
                const last = kSteps.length - 1;
                if (kVal >= kSteps[last]) return angleTable[last][schemeIdx];

                for (let i = 0; i < last; i++) {
                    if (kVal >= kSteps[i] && kVal <= kSteps[i + 1]) {
                        const ratio = (kVal - kSteps[i]) / (kSteps[i + 1] - kSteps[i]);
                        return angleTable[i][schemeIdx] + ratio * (angleTable[i + 1][schemeIdx] - angleTable[i][schemeIdx]);
                    }
                }
            }

            function getInterpolatedUf(angle, kVal, schemeIdx) {
                const angles = Object.keys(cieAngleTables).map(Number).sort((a, b) => a - b);
                if (angle <= angles[0]) return getUfByK(cieAngleTables[angles[0]], kVal, schemeIdx);
                const lastA = angles[angles.length - 1];
                if (angle >= lastA) return getUfByK(cieAngleTables[lastA], kVal, schemeIdx);

                for (let i = 0; i < angles.length - 1; i++) {
                    if (angle >= angles[i] && angle <= angles[i + 1]) {
                        const uf1 = getUfByK(cieAngleTables[angles[i]], kVal, schemeIdx);
                        const uf2 = getUfByK(cieAngleTables[angles[i + 1]], kVal, schemeIdx);
                        const ratio = (angle - angles[i]) / (angles[i + 1] - angles[i]);
                        return uf1 + ratio * (uf2 - uf1);
                    }
                }
            }

            const ufHigh = getInterpolatedUf(beamAngle, roomIndex, 0);
            const ufMed = getInterpolatedUf(beamAngle, roomIndex, 1);
            const wallDiff = (reflectance.walls - 0.70) / 0.20;
            const floorDiff = (reflectance.floor - 0.30) / 0.10;
            const ceilingDiff = (reflectance.ceiling - 0.80) / 0.10;

            let uf = ufHigh + (ufHigh - ufMed) * (wallDiff * 0.7 + floorDiff * 0.2 + ceilingDiff * 0.1);
            uf = Math.min(Math.max(uf, 0.20), 0.96);

            const requiredTotalLumens = (targetLux * area) / (uf * maintenanceFactor);
            const actualTotalLumens = fixtureCount * fixtureLumens;
            const actualLux = (actualTotalLumens * uf * maintenanceFactor) / area;

            return {
                area_m2: Number(area.toFixed(2)),
                roomIndex_K: Number(roomIndex.toFixed(2)),
                utilizationFactor_Uf: Number(uf.toFixed(3)),
                requiredTotalLumens: Math.round(requiredTotalLumens),
                requiredLumensPerFixture: Math.round(requiredTotalLumens / fixtureCount),
                actualTotalLumens: Math.round(actualTotalLumens),
                actualLux: Math.round(actualLux),
                compliancePercent: Math.round((actualLux / targetLux) * 100)
            };
        }

        const zoneConfigs = [

                    fixtureDrop: 0.05,

                    maintenanceFactor: 0.80,
                    fixtureCount: 2,
                    fixtureLumens: 2308
                }
            },
            {
                name: 'Кухня',
                params: {
                    length: 3.1,

                    ceilingHeight: 2.6,
                    fixtureDrop: 0,
                    workPlane: 0.9,
                    targetLux: 175,
                    beamAngle: 70,
                    reflectance: { ceiling: 0.80, walls: 0.60, floor: 0.20 },
                    maintenanceFactor: 0.80,
                    fixtureCount: 5,
                    fixtureLumens: 400
                }
            },
            {
                name: 'Спальня',
                params: {
                    length: 3.6,
                    width: 2.8,
                    ceilingHeight: 2.6,
                    fixtureDrop: 0,
                    workPlane: 0.5,
                    targetLux: 150,
                    beamAngle: 60,
                    reflectance: { ceiling: 0.80, walls: 0.70, floor: 0.30 },
                    maintenanceFactor: 0.80,
                    fixtureCount: 4,
                    fixtureLumens: 550
                }
            },
            {
                name: 'Кабинет',
                params: {
                    length: 1.8,
                    width: 2.8,
                    ceilingHeight: 2.6,
                    fixtureDrop: 0.06,
                    workPlane: 0.7,
                    targetLux: 200,
                    beamAngle: 120,
                    reflectance: { ceiling: 0.80, walls: 0.70, floor: 0.30 },
                    maintenanceFactor: 0.80,
                    fixtureCount: 1,
                    fixtureLumens: 1500
                }
            },
            {
                name: 'Прихожая',
                params: {
                    length: 2.8,
                    width: 2.5,
                    ceilingHeight: 2.6,
                    fixtureDrop: 0.06,
                    workPlane: 0.7,
                    targetLux: 150,
                    beamAngle: 120,
                    reflectance: { ceiling: 0.80, walls: 0.65, floor: 0.25 },
                    maintenanceFactor: 0.80,

                    fixtureLumens: 1500
                }
            },
            {
                name: 'Туалет',
                params: {
                    length: 1.3,

                    ceilingHeight: 2.6,
                    fixtureDrop: 0,
                    workPlane: 0.7,
                    targetLux: 200,
                    beamAngle: 60,
                    reflectance: { ceiling: 0.80, walls: 0.50, floor: 0.25 },
                    maintenanceFactor: 0.80,
                    fixtureCount: 2,
                    fixtureLumens: 550
                }
            },
            {
                name: 'Ванная',
                params: {
                    length: 2.1,
                    width: 1.4,
                    ceilingHeight: 2.6,
                    fixtureDrop: 0,
                    workPlane: 0.7,
                    targetLux: 200,
                    beamAngle: 60,
                    reflectance: { ceiling: 0.80, walls: 0.50, floor: 0.25 },
                    maintenanceFactor: 0.80,
                    fixtureCount: 3,
                    fixtureLumens: 550
                }
            },
            {
                name: 'Гардероб',
                params: {
                    length: 1.3,
                    width: 1.3,
                    ceilingHeight: 2.6,
                    fixtureDrop: 0,
                    workPlane: 0.7,
                    targetLux: 200,
                    beamAngle: 60,
                    reflectance: { ceiling: 0.80, walls: 0.50, floor: 0.30 },
                    maintenanceFactor: 0.80,
                    fixtureCount: 2,
                    fixtureLumens: 550
                }
            }
        ];

        const zonesContainer = document.getElementById('zones');

        function formatValue(value) {
            if (value === undefined || value === null || Number.isNaN(value)) return '—';
            return value;
        }

        function createZoneCard(zone) {
            const card = document.createElement('div');
            card.className = 'zone-card';

            const form = document.createElement('form');
            form.className = 'zone-form';
            form.innerHTML = `
                <div class="card-header">
                    <h2>${zone.name}</h2>
                    <span class="zone-tag">Параметры</span>
                </div>

                <div class="grid">
                    <label>
                        <span>Длина, м</span>
                        <input name="length" type="number" step="0.1" value="${zone.params.length}" required>
                    </label>
                    <label>
                        <span>Ширина, м</span>
                        <input name="width" type="number" step="0.1" value="${zone.params.width}" required>
                    </label>
                    <label>
                        <span>Высота потолка, м</span>
                        <input name="ceilingHeight" type="number" step="0.1" value="${zone.params.ceilingHeight}" required>
                    </label>
                    <label>
                        <span>Опуск светильника, м</span>
                        <input name="fixtureDrop" type="number" step="0.01" value="${zone.params.fixtureDrop}">
                    </label>
                    <label>
                        <span>Рабочая плоскость, м</span>
                        <input name="workPlane" type="number" step="0.1" value="${zone.params.workPlane}">
                    </label>
                    <label>
                        <span>Цель, лк</span>
                        <input name="targetLux" type="number" step="1" value="${zone.params.targetLux}">
                    </label>
                    <label>
                        <span>Угол светильника, °</span>
                        <input name="beamAngle" type="number" step="1" value="${zone.params.beamAngle}">
                    </label>
                    <label>
                        <span>Коэфф. запаса</span>
                        <input name="maintenanceFactor" type="number" step="0.01" value="${zone.params.maintenanceFactor}">
                    </label>
                    <label>
                        <span>Количество светильников</span>
                        <input name="fixtureCount" type="number" step="1" value="${zone.params.fixtureCount}">
                    </label>
                    <label>
                        <span>Люмен на светильник</span>
                        <input name="fixtureLumens" type="number" step="10" value="${zone.params.fixtureLumens}">
                    </label>
                    <label>
                        <span>Потолок, %</span>
                        <input name="ceiling" type="number" step="0.05" min="0" max="1" value="${zone.params.reflectance.ceiling}">
                    </label>
                    <label>
                        <span>Стены, %</span>
                        <input name="walls" type="number" step="0.05" min="0" max="1" value="${zone.params.reflectance.walls}">
                    </label>
                    <label>
                        <span>Пол, %</span>
                        <input name="floor" type="number" step="0.05" min="0" max="1" value="${zone.params.reflectance.floor}">
                    </label>
                </div>

                <button type="submit">Рассчитать</button>
            `;

            const resultBox = document.createElement('aside');
            resultBox.className = 'result-box';
            resultBox.innerHTML = `
                <div class="card-header">
                    <h3>Результат</h3>
                    <span class="zone-tag muted">UI</span>
                </div>

                <div class="result-list">
                    <div class="result-row"><span>Площадь</span><strong data-key="area_m2">—</strong></div>
                    <div class="result-row"><span>Индекс помещения</span><strong data-key="roomIndex_K">—</strong></div>
                    <div class="result-row"><span>Коэффициент Uf</span><strong data-key="utilizationFactor_Uf">—</strong></div>
                    <div class="result-row"><span>Требуемый свет</span><strong data-key="requiredTotalLumens">—</strong></div>
                    <div class="result-row"><span>На 1 светильник</span><strong data-key="requiredLumensPerFixture">—</strong></div>
                    <div class="result-row"><span>Фактический свет</span><strong data-key="actualTotalLumens">—</strong></div>
                    <div class="result-row"><span>Фактическая освещенность</span><strong data-key="actualLux">—</strong></div>
                    <div class="result-row"><span>Соответствие норме</span><strong data-key="compliancePercent">—</strong></div>
                </div>
            `;

            form.addEventListener('submit', (event) => {
                event.preventDefault();
                const formData = new FormData(form);

                const params = {
                    length: Number(formData.get('length')),
                    width: Number(formData.get('width')),
                    ceilingHeight: Number(formData.get('ceilingHeight')),
                    fixtureDrop: Number(formData.get('fixtureDrop')),
                    workPlane: Number(formData.get('workPlane')),
                    targetLux: Number(formData.get('targetLux')),
                    beamAngle: Number(formData.get('beamAngle')),
                    reflectance: {
                        ceiling: Number(formData.get('ceiling')),
                        walls: Number(formData.get('walls')),
                        floor: Number(formData.get('floor'))
                    },
                    maintenanceFactor: Number(formData.get('maintenanceFactor')),
                    fixtureCount: Number(formData.get('fixtureCount')),
                    fixtureLumens: Number(formData.get('fixtureLumens'))
                };

                try {
                    const result = calculateLighting(params);
                    Object.entries(result).forEach(([key, value]) => {
                        const element = resultBox.querySelector(`[data-key="${key}"]`);
                        if (element) {
                            const labelMap = {
                                area_m2: 'м²',
                                roomIndex_K: '',
                                utilizationFactor_Uf: '',
                                requiredTotalLumens: 'лм',
                                requiredLumensPerFixture: 'лм',
                                actualTotalLumens: 'лм',
                                actualLux: 'лк',
                                compliancePercent: '%'
                            };
                            const suffix = labelMap[key] || '';
                            element.textContent = `${formatValue(value)}${suffix ? ' ' + suffix : ''}`;
                        }
                    });
                } catch (error) {
                    resultBox.querySelectorAll('[data-key]').forEach((element) => {
                        element.textContent = 'Ошибка';
                    });
                    alert(error.message);
                }
            });

            card.append(form, resultBox);
            return card;
        }

        zoneConfigs.forEach((zone) => {
            zonesContainer.appendChild(createZoneCard(zone));
        });

        const style = document.createElement('style');
        style.textContent = `
            * { box-sizing: border-box; }
            body {
                margin: 0;
                background: #f3f5f9;
                color: #1a1f2b;
                font-family: Arial, sans-serif;
            }
            .app-shell {
                max-width: 1400px;
                margin: 0 auto;
                padding: 32px 20px 48px;
            }
            h1 {
                margin: 0 0 24px;
                font-size: 32px;
            }
            #zones {
                display: grid;

                gap: 20px;

                display: grid;

            .card-header {
                display: flex;

                gap: 12px;
            }
            .card-header h2,
            .card-header h3 {
                margin: 0;

            }
            .zone-tag {
                font-size: 12px;
                padding: 6px 10px;
                border-radius: 999px;
                background: #e6f2ff;
                color: #0a4db6;
                font-weight: 700;
            }
            .zone-tag.muted {
                background: #f3f4f6;
                color: #4b5563;
            }
            .grid {
                display: grid;
                grid-template-columns: repeat(2, minmax(120px, 1fr));
                gap: 12px;
            }
            label {
                display: flex;
                flex-direction: column;
                gap: 6px;
                font-size: 13px;
                color: #49556b;
            }
            input {
                width: 100%;

                border: 1px solid #d1d5db;
                border-radius: 10px;
                font-size: 14px;
                background: #fff;
            }
            button {
                align-self: flex-start;

                padding: 12px 18px;

                transition: transform 0.2s ease;
            }
            button:hover {
                transform: translateY(-1px);
            }
            .result-box {
                background: #f8fafc;
                border: 1px solid #e5e7eb;
                border-radius: 14px;
                padding: 14px;
            }
            .result-list {
                display: grid;
                gap: 10px;
                margin-top: 14px;
            }
            .result-row {
                display: flex;
                justify-content: space-between;
                gap: 12px;
                padding: 10px 12px;
                background: white;
                border: 1px solid #edf1f6;
                border-radius: 10px;
                font-size: 14px;
            }
            .result-row span {
                color: #52607a;
            }
            .result-row strong {
                color: #111827;
                font-weight: 700;
            }
            @media (max-width: 900px) {
                #zones {
                    grid-template-columns: 1fr;
                }
                .zone-card {
                    grid-template-columns: 1fr;
                }
            }
            @media (max-width: 560px) {
                .grid {
                    grid-template-columns: 1fr;
                }
                h1 {
                    font-size: 26px;
                }
            }
        `;
        document.head.appendChild(style);
    </script>
